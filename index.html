<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>林间小屋 · Forest Cabin</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1220; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #hint {
      position: fixed; left: 14px; bottom: 12px; z-index: 5;
      font: 12px/1.6 system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      color: rgba(240, 235, 220, 0.72); text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      pointer-events: none; user-select: none;
    }
    #hint kbd {
      font: inherit; padding: 0 5px; border: 1px solid rgba(240,235,220,0.35);
      border-radius: 4px; border-bottom-width: 2px; margin: 0 1px;
    }
    #loading {
      position: fixed; inset: 0; z-index: 10; display: flex;
      align-items: center; justify-content: center;
      background: #0b1220; color: #8fa3c8; transition: opacity 0.6s;
      font: 14px system-ui, 'Microsoft YaHei', sans-serif; letter-spacing: 0.3em;
    }
    #loading.gone { opacity: 0; pointer-events: none; }
    #webgl-fail {
      position: fixed; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center; padding: 24px;
      background: #0b1220; color: #c9d4ea; text-align: center;
      font: 15px/1.8 system-ui, 'Microsoft YaHei', sans-serif;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="hint"></div>
  <div id="loading">来 到 林 深 之 处</div>
  <div id="webgl-fail"><div>你的浏览器不支持 WebGL2，无法渲染这片森林。<br>请更新到新版 Edge / Chrome / Firefox。</div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
